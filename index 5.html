<title>مسابقة هدي المجيد</title>

<style>
/* Layout: one question per screen, game-show flow. Look: "competition night" — deep navy ground with a faint girih star pattern, emerald + gold, Kufi display */
:root{
  --bg:#0A1322; --bg2:#0E2233; --surface:#101D31; --surface2:#15273F; --ink:#EEF3F8; --muted:#93A6BC; --line:#22364F;
  --accent:#2FD3A7; --accent-ink:#06261F; --accent-soft:#11343A; --gold:#F2C14E; --gold2:#FFE29A;
  --ok:#3EE08F; --ok-soft:#0F3528; --bad:#FF6B6B; --bad-soft:#3B1720;
  --c0:#2FD3A7; --c1:#FF8A4C; --c2:#5AA9FF; --c3:#C084FC; --c4:#F2C14E; --c5:#FF5C8A;
  --shadow:0 18px 40px -18px rgba(0,0,0,.65);
  --pat:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28255%2C255%2C255%2C0.045%29%22%20stroke-width%3D%221%22%3E%3Cpath%20d%3D%22M48%2014l10%2024%2024%2010-24%2010-10%2024-10-24-24-10%2024-10z%22/%3E%3Cpath%20d%3D%22M24%2024h48v48H24z%22%20transform%3D%22rotate%2845%2048%2048%29%22/%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%227%22/%3E%3Cpath%20d%3D%22M0%200l14%2014M96%200L82%2014M0%2096l14-14M96%2096L82%2082%22/%3E%3C/g%3E%3C/svg%3E");
  --f-body:"Tajawal", "Segoe UI", Tahoma, sans-serif;
  --f-display:"Tajawal", "Segoe UI", Tahoma, sans-serif;
  --f-verse:"Tajawal", "Segoe UI", Tahoma, sans-serif;
  --fsm:1;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EAF1F5; --bg2:#DCEAF0; --surface:#FFFFFF; --surface2:#F5FAFC; --ink:#0D1B2E; --muted:#4F6378; --line:#D0DCE6;
  --accent:#0B8F70; --accent-ink:#FFFFFF; --accent-soft:#DDF3EC; --gold:#B57A12; --gold2:#E0A93A;
  --ok:#138A4E; --ok-soft:#E1F5EA; --bad:#C93A3A; --bad-soft:#FBE6E6;
  --c0:#0B8F70; --c1:#D2611E; --c2:#2C6FD1; --c3:#8B4FC9; --c4:#B57A12; --c5:#C93468;
  --shadow:0 16px 34px -20px rgba(13,27,46,.35);
  --pat:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%2296%22%20viewBox%3D%220%200%2096%2096%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%2813%2C27%2C46%2C0.06%29%22%20stroke-width%3D%221%22%3E%3Cpath%20d%3D%22M48%2014l10%2024%2024%2010-24%2010-10%2024-10-24-24-10%2024-10z%22/%3E%3Cpath%20d%3D%22M24%2024h48v48H24z%22%20transform%3D%22rotate%2845%2048%2048%29%22/%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2248%22%20r%3D%227%22/%3E%3Cpath%20d%3D%22M0%200l14%2014M96%200L82%2014M0%2096l14-14M96%2096L82%2082%22/%3E%3C/g%3E%3C/svg%3E");
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-verse);font-size:2.1rem;line-height:1.3;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
.rounds{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.round{display:flex;justify-content:space-between;align-items:center;gap:12px;font:inherit;text-align:right;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer}
.round .rn{color:var(--gold);font-weight:700}
.round small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.round.done{border-color:var(--accent)}
.round.done small{color:var(--accent);font-weight:700}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--bg)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:.85rem;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 12px;font-weight:500}
.count{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.qnum{font-family:var(--f-verse);color:var(--gold);font-size:1.15rem;margin-top:18px}
.stem{font-size:1.2rem;font-weight:700;margin:2px 0 0;text-wrap:balance}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{font:inherit;text-align:right;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt b{color:var(--muted);font-weight:500;min-width:1.2em}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-weight:700;font-size:1.1rem}
.verse{font-family:var(--f-verse);font-size:1.4rem;line-height:2;margin-top:12px;display:grid;gap:2px;text-align:center}
.verse .blank{color:var(--muted);letter-spacing:2px}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.98rem}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--accent-soft);color:var(--ink)}
.feedback .v{font-family:var(--f-verse);font-size:1.3rem;display:block;text-align:center;line-height:2}
.self{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.self .opt{justify-content:center;font-weight:700}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.big{font-family:var(--f-verse);font-size:3.2rem;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums;margin-top:10px}
.breakdown{display:grid;gap:8px;margin-top:14px}
.breakdown div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-block:6px;font-variant-numeric:tabular-nums}
.btn.small{font-size:.85rem;padding:8px 12px;font-weight:500}
.top h1{min-width:0}
.set h2{font-size:1rem;margin:0 0 6px;color:var(--accent)}
.set .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.set h2 + .row{border-top:0}
.set .row.col{flex-direction:column;align-items:stretch}
.set .row label{font-weight:500}
.set .row small{display:block;color:var(--muted);font-size:.8rem;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:.88rem;border:0;background:none;color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--bg);font-weight:700}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:right .2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{right:23px}
.sw:focus-visible,.text:focus-visible,.chk input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.text{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.chk input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sub.warn{color:var(--bad);font-weight:500}
.pair{display:flex;gap:10px;flex-wrap:wrap}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 12px;font-size:.95rem}
.clock.low{color:var(--bad);background:var(--bad-soft)}
.clock.off{opacity:.45}
.late{color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.team{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.team .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.team b{font-variant-numeric:tabular-nums;font-size:1.15rem}
.team.active{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc) inset}
.team.lead b{color:var(--gold)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none;display:inline-block}
.t0{--tc:var(--c0)}.t1{--tc:var(--c1)}.t2{--tc:var(--c2)}.t3{--tc:var(--c3)}.t4{--tc:var(--c4)}.t5{--tc:var(--c5)}
.turn{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:1.05rem;color:var(--muted)}
.turn b{color:var(--tc)}
.tlist{display:grid;gap:8px;padding-top:4px}
.trow{display:flex;align-items:center;gap:8px}
.trow .text{flex:1;min-width:0}
.winner{text-align:center}
.winner .big{font-size:2.4rem;color:var(--gold)}
.status{margin-top:16px;padding:10px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);color:var(--muted);text-align:center;font-weight:500}
.status.on{border:2px solid var(--tc);color:var(--ink);background:var(--surface)}
.status.on b{color:var(--tc)}
.status.miss{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.status.win{border:2px solid var(--tc);background:var(--ok-soft);color:var(--ok);font-weight:700}
.buzzers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.buzz{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:16px;border:0;background:var(--tc);color:var(--bg);cursor:pointer;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 60%,#000);transition:transform .08s,box-shadow .08s;min-width:0}
.buzz:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--tc) 60%,#000)}
.buzz .bell{font-size:1.6rem;line-height:1}
.buzz .bn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buzz kbd{font-family:inherit;font-size:.75rem;opacity:.8;border:1px solid currentColor;border-radius:5px;padding:0 6px}
.buzz:disabled{cursor:default;opacity:.35;box-shadow:none}
.buzz.active{opacity:1;outline:3px solid var(--gold);outline-offset:3px}
.buzz.out{text-decoration:line-through}
.skip{margin-top:12px}
@media (prefers-reduced-motion:no-preference){.buzz.active{animation:ring .5s ease-in-out 2}@keyframes ring{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:.85rem;font-weight:700;border-radius:999px;padding:3px 12px;background:var(--accent-soft);color:var(--accent)}
.badge.admin{background:var(--gold);color:var(--bg)}
.who .badge{margin-left:auto}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:6px}
.door{display:flex;flex-direction:column;gap:10px}
.door h2{margin:0;font-family:var(--f-verse);font-size:1.6rem;color:var(--accent)}
.door .sub{margin:0}
.door .btn{margin-top:auto}
.door label{font-weight:500;font-size:.92rem}
.text.shake{border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.text.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.center{text-align:center}
.bellwrap{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.bellwrap h1{text-align:center}
.waitcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pulse{width:18px;height:18px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.6);opacity:.4}}}
.teampick{display:grid;gap:10px}
.waitline{display:flex;align-items:center;gap:10px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:.92rem}
.waitline .pulse{width:12px;height:12px;flex:none}
.teampick .buzz{padding:18px}
.bigbell{font:inherit;align-self:center;width:min(72vw,52vh,26rem);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;background:var(--tc);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 10px 0 color-mix(in srgb,var(--tc) 55%,#000);transition:transform .08s,box-shadow .08s,opacity .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.bigbell .ico{font-size:4.2rem;line-height:1}
.bigbell .lbl{font-size:1.5rem;font-weight:700}
.bigbell:disabled{opacity:.3;cursor:default;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.bigbell.live:active,.bigbell.pressed{transform:translateY(8px);box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.bigbell.mine{opacity:1;outline:6px solid var(--gold);outline-offset:6px}
.status.go{border:2px solid var(--accent);color:var(--accent);background:var(--accent-soft);font-size:1.2rem;font-weight:700}
.status.win{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:no-preference){.bigbell.live{animation:glow 1.2s ease-in-out infinite}@keyframes glow{50%{transform:scale(1.03)}}.bigbell.mine{animation:ring .5s ease-in-out 3}}
.buzz{background:var(--surface);color:var(--ink);border:2px solid var(--tc);box-shadow:none;position:relative}
.buzz .bell{filter:grayscale(1);opacity:.6}
.buzz kbd{color:var(--muted)}
.buzz.hit{background:var(--tc);color:var(--bg);box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 60%,#000)}
.buzz.hit .bell{filter:none;opacity:1}
.buzz.hit kbd{color:inherit}
.buzz:disabled{opacity:.4}
.buzz.hit:disabled{opacity:1;cursor:default}
.buzz.out.hit{opacity:.45}
.buzz .rank:empty{display:none}
.buzz .rank{position:absolute;top:-10px;left:-10px;min-width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--bg);font-weight:700;font-size:1rem;display:grid;place-items:center;box-shadow:0 2px 6px color-mix(in srgb,#000 25%,transparent);font-variant-numeric:tabular-nums}
.teampick .buzz{background:var(--tc);color:var(--bg);border:0}
.teampick .buzz .bell{filter:none;opacity:1}
.myrank{align-self:center;display:flex;flex-direction:column;align-items:center;line-height:1.1;color:var(--tc)}
.myrank small{color:var(--muted);font-size:.85rem}
.myrank b{font-family:var(--f-verse);font-size:3rem}
.qtabs{margin-top:14px}
.qlist{display:flex;flex-direction:column;margin-top:10px}
.qrow{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.qrow .qn{color:var(--gold);font-weight:700;min-width:1.6em;font-variant-numeric:tabular-nums}
.qrow .qs{flex:1;min-width:0;font-size:.95rem}
.qrow .qacts{display:flex;gap:6px;flex:none}
.qrow.flash{background:var(--ok-soft)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.qform{display:flex;flex-direction:column;gap:4px;padding:14px;margin-block:4px 10px;border:2px solid var(--accent);border-radius:12px;background:var(--bg)}
.qform .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.qform .row.col{flex-direction:column;align-items:stretch;gap:6px}
.qform label{font-weight:500;font-size:.92rem}
.qform textarea.text{resize:vertical;font:inherit}
.optedit{display:flex;align-items:center;gap:8px}
.optedit input[type=radio]{accent-color:var(--ok);width:20px;height:20px;margin:0;flex:none}
.optedit .text{flex:1;min-width:0}
.qform .pair{justify-content:flex-end;margin-top:6px}
@media (max-width:460px){.qrow{flex-wrap:wrap}.qrow .qacts{margin-inline-start:auto}}
.hiddenopts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding:14px 16px;border:1.5px dashed color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:14px;color:var(--muted);background:color-mix(in srgb,var(--gold) 6%,transparent)}
.hiddenopts span{font-weight:700}
.ranklist{display:flex;flex-direction:column;gap:10px}
.rankrow{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--tc) 50%,var(--line));overflow:hidden;background:color-mix(in srgb,var(--bg) 55%,var(--surface))}
.rankrow::before{content:"";position:absolute;inset:0 0 0 auto;width:var(--w);background:color-mix(in srgb,var(--tc) 22%,transparent);transition:width .6s ease-out}
.rankrow > *{position:relative}
.rankrow .pl{font-family:var(--f-display);font-size:1.5rem;color:var(--gold);min-width:1.4em;text-align:center}
.rankrow .nm{flex:1;min-width:0;font-weight:700;font-size:1.1rem}
.rankrow .pt{font-family:var(--f-display);font-size:1.6rem;color:var(--tc);font-variant-numeric:tabular-nums}
.rankrow.first{border-color:var(--gold);box-shadow:0 0 24px -8px var(--gold)}
.rankline{color:var(--gold);font-weight:700}
@media (prefers-reduced-motion:no-preference){.rankrow{animation:rin .45s ease-out both;animation-delay:var(--d)}@keyframes rin{from{opacity:.2;transform:translateX(-14px)}to{opacity:1;transform:none}}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-top:34px;min-height:300px}
.pcol{flex:1 1 0;max-width:170px;min-width:0;display:flex;flex-direction:column;align-items:stretch}

function makePeerRoom() {

        peersMap.set(cn.peer, p); notify({ joined: [p] });

        if (!m || m.k !== "pr" || typeof m.p !== "object") return;
        const old = peersMap.get(cn.peer); if (!old) return;
        const p = Object.freeze({ ...old, presence: Object.freeze({ ...m.p }), updatedAt: Date.now() });

      });

function renderBell() {
  if (role !== "player" || !bellRoot || !bellRoot.isConnected) return;
  const st0 = lastState && Date.now() - lastStateAt < 12000 ? lastState : null;

  bellRoot.append(team);

  const live = !!(room && room.connected());
  const q = st0 && st0.qid && !st0.idle ? st0 : null;
  const excluded = q && !q.done && Array.isArray(q.excluded) && q.excluded.includes(myTeam);
  const mine = q && !q.done && q.answering === myTeam;
  const other = q && !q.done && q.answering != null && q.answering !== myTeam;
  const rank = q && !q.done && Array.isArray(q.order) ? q.order.indexOf(myTeam) : -1;
  const open = q && q.open && !q.done && !excluded && rank < 0;
  const readingNow = q && !q.done && q.reading > 0;

  let msg = "الجرس جاهز. اضغط أول ما يُعرض السؤال", cls = "go";
  if (q && q.done) { msg = q.winner === myTeam ? "أحسنتم! النقطة لفريقكم" : q.winner != null && teams[q.winner] ? "النقطة لـ«" + teams[q.winner] + "»" : "انتهى السؤال، استعدوا للتالي"; cls = q.winner === myTeam ? "win" : ""; }
  else if (mine) { msg = "دوركم! أجيبوا الآن"; cls = "win"; }
  else if (excluded) { msg = "خرج فريقكم من هذا السؤال"; cls = "miss"; }
  else if (readingNow) { msg = "اقرؤوا السؤال… يُفتح الجرس بعد " + AR(q.reading) + " ث"; cls = "reading"; }
  else if (rank >= 0) { msg = "ضغطتم الجرس، ترتيبكم " + AR(rank + 1) + (other ? ". يجيب الآن «" + (teams[q.answering] || "") + "»" : ""); cls = ""; }
  else if (other) { msg = "يجيب الآن «" + (teams[q.answering] || "") + "». اضغطوا لتكونوا التالين"; cls = "go"; }
  else if (open) { msg = "اضغط الجرس!"; cls = "go"; }
  if (q && q.qn && !q.done) bellRoot.append(el("p", "sub center", "السؤال " + AR(q.qn)));
  if (!q && st0 && Array.isArray(st0.totals) && typeof st0.totals[myTeam] === "number") {
    const tt = st0.totals, mine2 = tt[myTeam], place = 1 + tt.filter(v => v > mine2).length;
    bellRoot.append(el("p", "sub center rankline", "ترتيب فريقكم: " + AR(place) + " من " + AR(tt.length) + " · " + AR(mine2) + " نقطة"));
  }

  const locked = !!(excluded || mine || rank >= 0 || readingNow);
  if (rank >= 0) { const rb = el("div", "myrank " + tc); rb.append(el("small", "", "ترتيبكم"), el("b", "", AR(rank + 1))); bellRoot.append(rb); }
  const big = btn("", "bigbell live " + tc + (mine ? " mine" : ""), () => {
    if (locked) return;
    big.classList.add("pressed"); setTimeout(() => big.classList.remove("pressed"), 150);
    if (open && room) {
      myPresses++;
      room.presence({ role: "player", team: myTeam, name: playerName || null, buzz: q.qid, n: myPresses }).catch(() => {});
      status.className = "status"; status.textContent = "تم الضغط… بانتظار المشرف";
    } else {
      ringBell();
      status.className = "status go"; status.textContent = "الجرس يعمل ✓ انتظر السؤال";
    }
  });
  big.id = "bigbell";
  big.disabled = locked;
  big.append(el("span", "ico", "🔔"), el("span", "lbl", "الجرس"));
  bellRoot.append(big);
  const status = el("div", "status " + cls, msg); status.setAttribute("aria-live", "polite");
  bellRoot.append(status);
  if (!room) bellRoot.append(el("p", "sub center warn", STANDALONE ? "تعذّر الاتصال. تحقق من الإنترنت ثم أعد فتح الصفحة." : "غير متصل بالمسابقة: سجّل الدخول وافتح الرابط الذي شاركه المشرف."));
  else if (!live) bellRoot.append(el("p", "sub center", "جارٍ الاتصال…"));
  if (mine && renderBell.lastMine !== q.qid + "|" + myPresses) { renderBell.lastMine = q.qid + "|" + myPresses; ringBell(); FX.ripple(big, teamColor(myTeam)); }
  if (q && q.done && q.winner === myTeam && renderBell.lastWin !== q.qid) { renderBell.lastWin = q.qid; FX.confetti(big, teamColor(myTeam)); playClap(); }
}

const ORIGINAL = JSON.stringify({ mcq: MCQ, tf: TF, ex: EX, v: V });
const QKEY = "tajweed-quiz-questions";
let qbankAt = 0;
function validBank(b) { return b && ["mcq", "tf", "ex", "v"].every(k => Array.isArray(b[k])); }
function useBank(b) { ROUNDS.forEach(r => { r.qs = b[r.type]; }); }
function bankNow() { const b = {}; ROUNDS.forEach(r => b[r.type] = r.qs); return b; }
(function loadLocalBank() {
  try {
    const raw = JSON.parse(localStorage.getItem(QKEY) || "null");
    if (raw && validBank(raw.q)) { useBank(raw.q); qbankAt = raw.t || 0; }
  } catch (e) {}
})();
function persistBank(b) {
  qbankAt = Date.now();
  useBank(b);
  try { localStorage.setItem(QKEY, JSON.stringify({ q: b, t: qbankAt })); } catch (e) {}
  if (db && role === "admin") db.doc("live/questions").set({ q: b, t: qbankAt }).catch(() => {});
}
function watchBank() {
  if (!db) return;
  db.doc("live/questions").onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data();
    if (!d || !validBank(d.q) || (d.t || 0) <= qbankAt) return;
    qbankAt = d.t || 0; useBank(d.q);
    try { localStorage.setItem(QKEY, JSON.stringify({ q: d.q, t: qbankAt })); } catch (e) {}
    if (st.scores.every(x => x == null) && document.querySelector(".screen .rounds")) { deal(); home(); }
  }, () => {});
}

/* ---------- game ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function prep(type, q) {
  if (type !== "mcq" || !S.shuffleOpts) return q;
  const [stem, opts, c, why] = q;
  const order = shuffle(opts.map((_, k) => k));
  return [stem, order.map(k => opts[k]), order.indexOf(c), why];
}
const newBy = () => ({ mcq: 0, tf: 0, ex: 0, v: 0 });
const teamsOn = () => role === "admin" && S.teamsOn && S.teams.length >= 2;
const zeros = () => S.teams.map(() => 0);
// committed team totals from finished rounds (optionally excluding one round being replayed)
function teamTotals(skip) { const t = zeros(); st.team.forEach((arr, k) => { if (arr && k !== skip) arr.forEach((v, i) => t[i] += v); }); return t; }
function board(scores, active) {
  const b = el("div", "board");
  const max = Math.max(...scores);
  S.teams.forEach((name, i) => {
    const d = el("div", "team t" + (i % 6) + (i === active ? " active" : "") + (active == null && max > 0 && scores[i] === max ? " lead" : ""));
    d.append(el("span", "dot"), el("span", "tn", name), el("b", "", AR(scores[i])));
    b.append(d);
  });
  return b;
}
// Spread each type evenly across the rounds, then interleave types inside a round so a capped round keeps a mix.
function deal() {
  const n = Math.max(1, Math.min(5, S.rounds));
  const buckets = Array.from({ length: n }, () => ROUNDS.map(() => []));
  let k = 0;
  ROUNDS.forEach((r, ti) => { if (!S.types[r.type]) return; (S.shuffleQ ? shuffle(r.qs) : r.qs).forEach(q => { buckets[k % n][ti].push({ t: r.type, q }); k++; }); });
  GAME = buckets.map(groups => {
    const out = [], g = groups.map(x => x.slice());
    while (g.some(x => x.length)) g.forEach(x => { if (x.length) out.push(x.shift()); });
    return S.perRound ? out.slice(0, S.perRound) : out;
  }).filter(g => g.length);
  st = { scores: GAME.map(() => null), by: GAME.map(() => null), team: GAME.map(() => null), turn: GAME.map(() => null) };
}
function newGame() { deal(); home(); }
function start(r) { const t0 = GAME.slice(0, r).reduce((a, g) => a + g.length, 0); cur = { r, i: 0, score: 0, pts: 0, by: newBy(), team: zeros(), t0, qs: (S.shuffleQ ? shuffle(GAME[r]) : GAME[r]).map(x => ({ t: x.t, q: prep(x.t, x.q) })) }; question(); }

/* ---------- visual effects ---------- */
const FX = (() => {
  const reduce = () => !S.fx || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  let cv = null, ctx = null, parts = [], raf = 0;
  function ensure() {
    if (cv) return;
    cv = document.createElement("canvas"); cv.className = "fxcanvas"; cv.setAttribute("aria-hidden", "true");
    document.body.append(cv); ctx = cv.getContext("2d");
    const size = () => { const d = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    size(); addEventListener("resize", size);
  }
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#F2C14E";
  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.shape === 0) ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      else if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2.6, 0, 6.283); ctx.fill(); }
      else { ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, r = k % 2 ? p.s / 4 : p.s / 1.6; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0;
  }
  function burst(x, y, colors, n = 70, power = 9, spread = Math.PI * 2, dir = -Math.PI / 2) {
    if (reduce()) return; ensure();
    for (let k = 0; k < n; k++) {
      const a = dir + (Math.random() - .5) * spread, v = power * (.45 + Math.random() * .75);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .22, drag: .985, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 7, c: colors[k % colors.length], life: 70 + Math.random() * 50, shape: k % 3 });

  function palette(extra) { return [css("--gold"), css("--gold2"), css("--accent"), extra || css("--c2"), "#ffffff"]; }
  function confetti(el, color) { at(el, palette(color), 80, 10); }
  function fireworks(colors, ms = 3200) {

// Word-by-word reveal: each word fades in after the previous one; RV accumulates the total delay for this question.
function W(tag, cls, text) {

}

function question() {

    scoreEl.hidden = true;
    boardEl = board(liveScores(), TI); s.append(boardEl);
  }
  const bar = el("div", "bar"); const fill = el("i"); fill.style.width = (cur.i / n * 100) + "%"; bar.append(fill); s.append(bar);

  const c = el("div", "card"); s.append(c);
  const qh = el("div", "qhead");
  qh.append(el("div", "qnum", "السؤال " + AR(cur.i + 1) + " من " + AR(n)));
  if (TI >= 0) { const tt = el("div", "turn t" + (TI % 6)); tt.append(el("span", "dot"), "دور: ", el("b", "", S.teams[TI])); c.append(qh); c.append(tt); }
  const clock = el("span", "clock"); if (S.timer) qh.append(clock);
  if (TI < 0) c.append(qh);
  const next = btn(cur.i + 1 < n ? "السؤال التالي ←" : "عرض النتيجة", "btn", () => advance());
  next.disabled = true;
  const setScore = () => { scoreEl.textContent = "النقاط: " + AR(cur.pts); if (boardEl) { const nb = board(liveScores(), TI); boardEl.replaceWith(nb); boardEl = nb; } };
  let mcqBox = null;
  const credit = () => { const p = qPoints(T, mcqBox); cur.score++; cur.pts += p; cur.by[T]++; if (TI >= 0) cur.team[TI] += p; };
  const unlock = () => { clearInterval(timerId); clock.classList.add("off"); cur.answered = true; next.disabled = false; next.focus(); };
  let onTimeout = () => {};

  if (T === "mcq" || T === "tf") {
    const [stem, a2, a3, a4] = q;
    const opts = T === "mcq" ? a2 : ["صح", "خطأ"];
    const correct = T === "mcq" ? a3 : (a2 ? 0 : 1);
    const why = T === "mcq" ? a4 : a3;
    c.append(W("p", "stem", T === "tf" ? "«" + stem + "»" : stem));
    const box = el("div", "opts" + (T === "tf" ? " tf" : "")); c.append(box);
    const finish = (k) => {
      box.querySelectorAll("button").forEach(x => x.disabled = true);
      box.children[correct].classList.add("ok");
      const right = k === correct;
      if (right) credit(); else if (k >= 0) box.children[k].classList.add("bad");
      if (right) { FX.confetti(box.children[correct], TI >= 0 ? teamColor(TI) : null); FX.flash("good"); playClap(); } else { FX.shake(c); FX.flash("bad"); }
      if (hid) hid.reveal();
      const head = k === -2 ? "إجابة خاطئة، والصواب: " + opts[correct] : k < 0 ? "انتهى الوقت، والصواب: " + opts[correct] : right ? "إجابة صحيحة" : "إجابة خاطئة، والصواب: " + opts[correct];
      box.after(el("div", "feedback " + (right ? "ok" : "bad"), head + (why && S.showWhy ? ". " + why : "")));
      setScore(); unlock();
    };
    opts.forEach((o, k) => {
      const b = btn("", "opt", () => finish(k)); b.id = "o" + k;
      if (T === "mcq") b.append(el("b", "", LET[k] + ")"));
      b.append(o); box.append(b);
    });
    let hid = null; mcqBox = T === "mcq" ? box : null;
    if (T === "mcq" && !S.showOpts) {
      hid = hideOptions(box, c, () => sj.remove());
      const sj = el("div", "self");
      const y = btn("أصاب ✓", "opt", () => { sj.remove(); finish(correct); }); y.id = "yes";
      const nn = btn("أخطأ ✗", "opt", () => { sj.remove(); finish(-2); }); nn.id = "no";
      sj.append(y, nn); hid.bar.after(sj);
    }
    staggerOpts(box);
    onTimeout = () => finish(-1);
  } else {
    let ansNode;
    if (T === "ex") {
      c.append(W("p", "stem", "اذكر مثالًا على: " + q[0]));
      ansNode = el("div", "feedback info", "من أمثلة المنهج: " + q[1]);
    } else {
      const [a, b, blank, src] = q;
      c.append(el("p", "stem", "أكمل البيت"));
      c.append(el("div", "sub", src));
      const vs = el("div", "verse");
      vs.append(blank === 0 ? el("span", "blank", "……………………") : W("span", "", a));
      vs.append(blank === 1 ? el("span", "blank", "……………………") : W("span", "", b));
      c.append(vs);
      ansNode = el("div", "feedback info");
      ansNode.append(el("span", "v", a), el("span", "v", b));
    }
    const show = btn("إظهار الإجابة", "btn ghost", () => {
      clearInterval(timerId); clock.classList.add("off");
      show.replaceWith(ansNode);
      c.append(el("p", "sub", TI >= 0 ? "هل كانت إجابة «" + S.teams[TI] + "» صحيحة؟" : "هل كانت إجابة المتسابق صحيحة؟"));
      const sg = el("div", "self");
      const mark = (ok, b) => { sg.querySelectorAll("button").forEach(x => x.disabled = true); b.classList.add(ok ? "ok" : "bad"); if (ok) credit(); setScore(); unlock(); if (ok) { FX.confetti(b, TI >= 0 ? teamColor(TI) : null); FX.flash("good"); playClap(); } else { FX.shake(c); FX.flash("bad"); } };
      const y = btn("أصاب ✓", "opt", () => mark(true, y)); y.id = "yes";
      const nn = btn("أخطأ ✗", "opt", () => mark(false, nn)); nn.id = "no";
      sg.append(y, nn); c.append(sg);
    });
    show.style.marginTop = "16px";
    c.append(show);
    onTimeout = () => {
      show.replaceWith(ansNode);
      ansNode.prepend(el("strong", "late", "انتهى الوقت. "));
      unlock();
    };
  }

  if (S.timer) {
    let left = S.timer;
    const tick = () => { clock.textContent = "⏱ " + AR(left); clock.classList.toggle("low", left <= 5); };
    tick();
    timerId = setInterval(() => { left--; tick(); if (left <= 0) { clearInterval(timerId); if (!cur.answered) onTimeout(); } }, 1000);
  }

  const act = el("div", "actions");
  act.append(btn("القائمة", "btn ghost", home), next);
  s.append(act);
}

let clapAudio = null;
function playClap(force) {
  if (!S.clap && !force) return;
  try {
    if (!clapAudio) clapAudio = new Audio(CLAP_SRC);
    clapAudio.pause(); clapAudio.currentTime = 0;
    const p = clapAudio.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

function buzzQuestion() {
  const it = cur.qs[cur.i], q = it.q, T = it.t, R = ROUNDS.find(x => x.type === T), n = cur.qs.length; RV = 0;
  cur.answered = false;
  const s = screen();
  const top = el("div", "top");
  top.append(el("span", "tag", (GAME.length > 1 ? "الجولة " + NR[cur.r] + " · " : "") + R.name), el("span", "count", "أسرع إجابة"));
  s.append(top);
  const liveScores = () => { const t = teamTotals(cur.r); cur.team.forEach((v, i) => t[i] += v); return t; };
  let boardEl = board(liveScores(), null); s.append(boardEl);
  const bar = el("div", "bar"); const fill = el("i"); fill.style.width = (cur.i / n * 100) + "%"; bar.append(fill); s.append(bar);

  const c = el("div", "card"); s.append(c);
  const qh = el("div", "qhead");
  qh.append(el("div", "qnum", "السؤال " + AR(cur.i + 1) + " من " + AR(n)));
  const clock = el("span", "clock"); if (S.timer) qh.append(clock);
  c.append(qh);

  // question body
  let box = null, opts = null, correct = -1, why = "", ansNode = null, bHid = null;
  if (T === "mcq" || T === "tf") {
    const [stem, a2, a3, a4] = q;
    opts = T === "mcq" ? a2 : ["صح", "خطأ"];
    correct = T === "mcq" ? a3 : (a2 ? 0 : 1);
    why = T === "mcq" ? a4 : a3;
    c.append(W("p", "stem", T === "tf" ? "«" + stem + "»" : stem));
    box = el("div", "opts" + (T === "tf" ? " tf" : "")); c.append(box);
    opts.forEach((o, k) => {
      const b = btn("", "opt", () => choose(k)); b.id = "o" + k; b.disabled = true;
      if (T === "mcq") b.append(el("b", "", LET[k] + ")"));
      b.append(o); box.append(b);
    });
    if (T === "mcq" && !S.showOpts) bHid = hideOptions(box, c, () => {
      if (answering != null && !done) [...box.children].forEach(b => { if (!b.classList.contains("bad")) b.disabled = false; });
    });
  } else if (T === "ex") {
    c.append(W("p", "stem", "اذكر مثالًا على: " + q[0]));
    ansNode = el("div", "feedback info", "من أمثلة المنهج: " + q[1]);
  } else {
    const [a, b, blank, src] = q;
    c.append(el("p", "stem", "أكمل البيت"));
    c.append(el("div", "sub", src));
    const vs = el("div", "verse");
    vs.append(blank === 0 ? el("span", "blank", "……………………") : W("span", "", a));
    vs.append(blank === 1 ? el("span", "blank", "……………………") : W("span", "", b));
    c.append(vs);
    ansNode = el("div", "feedback info");
    ansNode.append(el("span", "v", a), el("span", "v", b));
  }

  // buzzers
  const status = el("div", "status", "اضغطوا الجرس: الأسرع يجيب أولًا");
  const bz = el("div", "buzzers");
  const judge = el("div", "self"); judge.hidden = true;
  const skip = btn("لا أحد يعرف: إظهار الإجابة", "btn ghost small", () => finish(-1, "لم يُجب أحد."));
  skip.classList.add("skip");
  const excluded = new Set();
  let answering = null, done = false;
  const order = []; // teams in the order they pressed the bell
  let reading = Math.max(0, S.readTime | 0); // seconds left before the bell opens
  let revealing = false; // true while the question's words are still appearing

  S.teams.forEach((name, i) => {
    const b = btn("", "buzz t" + (i % 6), () => buzz(i)); b.id = "bz" + i;
    b.append(el("span", "rank"), el("span", "bell", "🔔"), el("span", "bn", name), el("kbd", "", AR(i + 1)));
    bz.append(b);
  });
  c.append(status, bz);
  c.append(judge);
  c.append(skip);

  const next = btn(cur.i + 1 < n ? "السؤال التالي ←" : "عرض النتيجة", "btn", () => advance());
  next.disabled = true;

  const qid = "q" + (++qSeq) + "-" + Date.now().toString(36);
  const emitQ = (extra) => hostEmit({ qid, qn: cur.i + 1, open: !done && !reading && !revealing, reading: revealing ? Math.max(reading, 1) : reading, answering, excluded: [...excluded], order: order.slice(), done, ...extra });
  const refresh = () => {
    [...bz.children].forEach((b, i) => {
      const r = order.indexOf(i);
      b.disabled = done || r >= 0 || reading > 0 || revealing;
      b.classList.toggle("wait", (reading > 0 || revealing) && !done);
      b.classList.toggle("hit", r >= 0);
      b.classList.toggle("active", answering === i);
      b.classList.toggle("out", excluded.has(i));
      b.querySelector(".rank").textContent = r >= 0 ? AR(r + 1) : "";
    });
  };

  // timer: runs while the floor is open, pauses while a team answers
  let left = S.timer;
  const tick = () => { clock.textContent = "⏱ " + AR(left); clock.classList.toggle("low", left <= 5); };
  const runClock = () => {
    if (!S.timer || done) return;
    clearInterval(timerId); clock.classList.remove("off");
    timerId = setInterval(() => { left--; tick(); if (left <= 0) { clearInterval(timerId); finish(-1, "انتهى الوقت."); } }, 1000);
  };
  const pauseClock = () => { clearInterval(timerId); clock.classList.add("off"); };
  if (S.timer) tick();

  function buzz(i) {
    if (done || reading > 0 || revealing || excluded.has(i) || order.includes(i) || i < 0 || i >= S.teams.length) return;
    order.push(i);
    const bzBtn = document.getElementById("bz" + i); FX.ripple(bzBtn, teamColor(i));
    ringBell();
    if (answering == null) setAnswer(i); else { refresh(); emitQ(); }
  }

  function setAnswer(i) {
    answering = i; pauseClock(); refresh(); emitQ();
    status.replaceChildren("يجيب الآن: ", el("b", "t" + (i % 6), S.teams[i]));
    status.className = "status on t" + (i % 6);
    if (box && !box.hidden) {
      [...box.children].forEach(b => { if (!b.classList.contains("bad")) b.disabled = false; });
    } else {
      judge.replaceChildren();
      const y = btn("أصاب ✓", "opt", () => choose(true)); y.id = "yes";
      const nn = btn("أخطأ ✗", "opt", () => choose(false)); nn.id = "no";
      judge.append(y, nn); judge.hidden = false;
    }
  }

  function choose(k) {
    if (done || answering == null) return;
    const i = answering;
    const right = typeof k === "boolean" ? k : k === correct;
    if (right) {
      const p = qPoints(T, box); cur.score++; cur.pts += p; cur.by[T]++; cur.team[i] += p;
      finish(i, "إجابة صحيحة من «" + S.teams[i] + "» (+" + AR(p) + ")");
      const tb = document.getElementById("bz" + i);
      FX.confetti(tb, teamColor(i)); FX.flash("good"); playClap(); FX.pop(tb, "+" + AR(p), teamColor(i));
      return;
    }
    if (box && typeof k === "number") box.children[k].classList.add("bad");
    FX.shake(c); FX.flash("bad");
    if (box) [...box.children].forEach(b => b.disabled = true);
    judge.hidden = true;
    excluded.add(i); answering = null;
    const remaining = S.teams.length - excluded.size;
    if (!remaining) { finish(-1, "أخطأت كل الأفرقة."); return; }
    const nx = order.find(t => !excluded.has(t));
    if (nx != null) { setAnswer(nx); status.prepend(el("span", "late", "أخطأ «" + S.teams[i] + "». ")); return; }
    status.className = "status miss";
    status.textContent = "إجابة خاطئة من «" + S.teams[i] + "». الجرس مفتوح لبقية الأفرقة.";
    refresh(); runClock(); emitQ();
  }

  function finish(winner, msg) {
    if (done) return;
    done = true; answering = null; reading = 0; revealing = false; clearInterval(readTimerId); clearTimeout(revealTimerId); if (openNow) openNow.remove(); pauseClock(); refresh();
    judge.hidden = true; skip.remove();
    document.removeEventListener("keydown", keyHandler);
    const ok = winner >= 0;
    status.className = "status " + (ok ? "win t" + (winner % 6) : "miss");
    status.textContent = ok ? "النقطة لـ«" + S.teams[winner] + "»" : msg;
    if (box) {
      if (bHid) bHid.reveal();
      [...box.children].forEach(b => b.disabled = true);
      box.children[correct].classList.add("ok");
      const f = el("div", "feedback " + (ok ? "ok" : "bad"), (ok ? msg : msg + " الصواب: " + opts[correct]) + (why && S.showWhy ? ". " + why : ""));
      box.after(f);
    } else {
      if (!ok) ansNode.prepend(el("strong", "late", msg + " "));
      status.after(ansNode);
    }
    const nb = board(liveScores(), null); boardEl.replaceWith(nb); boardEl = nb;
    cur.answered = true; next.disabled = false; next.focus();
    remoteBuzz = null; emitQ({ winner: ok ? winner : null });
  }

  keyHandler = (e) => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const d = "١٢٣٤٥٦".indexOf(e.key) >= 0 ? "١٢٣٤٥٦".indexOf(e.key) : "123456".indexOf(e.key);
    if (d >= 0 && d < S.teams.length) { e.preventDefault(); buzz(d); }
  };
  document.addEventListener("keydown", keyHandler);
  let openNow = null;
  const openBell = () => {
    clearInterval(readTimerId); reading = 0;
    if (openNow) { openNow.remove(); openNow = null; }
    if (done) return;
    status.className = "status go"; status.textContent = "الجرس مفتوح! اضغطوا الآن";
    FX.flash("go"); refresh(); emitQ(); runClock();
  };
  staggerOpts(box);
  const begin = () => {
  revealing = false;
  if (done) return;
  if (reading > 0) {
    const showRead = () => {
      status.className = "status reading";
      status.replaceChildren(el("span", "", "اقرؤوا السؤال… يُفتح الجرس بعد"), el("b", "rd", AR(reading)));
    };
    showRead();
    openNow = btn("فتح الجرس الآن", "btn ghost small", openBell); openNow.id = "open-now"; openNow.classList.add("skip");
    status.after(openNow);
    readTimerId = setInterval(() => { reading--; if (reading <= 0) openBell(); else { showRead(); emitQ(); } }, 1000);
    refresh(); emitQ();
  } else { openBell(); }
  };
  if (RV > 0) {
    revealing = true;
    status.className = "status reading"; status.textContent = "يُعرض السؤال…";
    refresh();
    revealTimerId = setTimeout(begin, RV + 300);
  } else if (reading > 0) begin();
  else { refresh(); runClock(); }
  curQid = qid; remoteBuzz = buzz; emitQ();

  const act = el("div", "actions");
  act.append(btn("القائمة", "btn ghost", home), next);
  s.append(act);
}

// Points for a correct answer: multiple-choice answered with its options showing earns the reduced score.
function qPoints(T, box) { return T === "mcq" && box && !box.hidden ? S.optPts : S.pts; }

function advance(skipRank) {
  const n = cur.qs.length;
  if (cur.i + 1 >= n) return result();
  if (!skipRank && teamsOn() && S.showRank) return rankScreen();
  cur.i++; question();
}

function rankScreen() {
  const s = screen();
  const totals = teamTotals(cur.r); cur.team.forEach((v, i) => totals[i] += v);
  hostEmit({ idle: true, totals });
  setTimeout(() => { const f = document.querySelector(".pcol.p1"); if (f && totals[order[0]] > 0) { const r = f.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + 20, [FX.css("--gold"), FX.css("--gold2"), teamColor(order[0]), "#fff"], 70, 9); } }, 1150);
  s.append(el("span", "tag", (GAME.length > 1 ? "الجولة " + NR[cur.r] + " · " : "") + "بعد السؤال " + AR(cur.i + 1) + " من " + AR(cur.qs.length)));
  s.append(el("h1", "", "ترتيب الأفرقة"));
  const c = el("div", "card"); s.append(c);
  const order = S.teams.map((n, i) => i).sort((a, b) => totals[b] - totals[a]);
  const places = []; order.forEach((i, k) => { places[k] = k && totals[i] === totals[order[k - 1]] ? places[k - 1] : k + 1; });
  // podium: top three, shown 2nd · 1st · 3rd
  const pod = el("div", "podium"); c.append(pod);
  const slots = [[1, "p2"], [0, "p1"], [2, "p3"]];
  slots.forEach(([k, cls], idx) => {
    if (order[k] == null) return;
    const i = order[k], pl = places[k];
    const col = el("div", "pcol " + cls + " t" + (i % 6));
    col.style.setProperty("--d", ({ p3: 0, p2: 1, p1: 2 })[cls] * 260 + "ms");
    const who = el("div", "pwho");
    if (pl === 1 && totals[i] > 0) who.append(el("span", "crown", "♛"));
    who.append(el("span", "pdot"), el("span", "pname", S.teams[i]), el("b", "ppts", AR(totals[i]) + " نقطة"));
    const block = el("div", "pblock"); block.append(el("span", "pnum", AR(pl)));
    col.append(who, block); pod.append(col);
  });
  // everyone below third place
  if (order.length > 3) {
    const list = el("div", "ranklist"); c.append(list);
    order.slice(3).forEach((i, k) => {
      const r = el("div", "rankrow t" + (i % 6));
      r.style.setProperty("--w", "0%"); r.style.setProperty("--d", (900 + k * 80) + "ms");
      r.append(el("span", "pl", AR(places[k + 3])), el("span", "nm", S.teams[i]), el("b", "pt", AR(totals[i])));
      list.append(r);
    });
  }
  const act = el("div", "actions");
  const off = btn("إيقاف عرض الترتيب", "btn ghost small", () => { S.showRank = false; save(); advance(true); });
  const go = btn("السؤال التالي ←", "btn", () => advance(true));
  go.id = "rank-next";
  act.append(off, go); s.append(act);
  go.focus();
}

function breakdown(by, list) {
  const bd = el("div", "breakdown");
  ROUNDS.forEach(r => { const tot = list.filter(x => x.t === r.type).length; if (!tot) return; const d = el("div"); d.append(el("span", "", r.name), el("b", "", AR(by[r.type]) + " / " + AR(tot))); bd.append(d); });
  return bd;
}
function verdict(p) { return p >= .9 ? "ممتاز، بارك الله فيك." : p >= .7 ? "أحسنت، مستوى جيد جدًا." : p >= .5 ? "جيد، راجع الأحكام التي أخطأت فيها." : "تحتاج إلى مراجعة هذه الأبواب مرة أخرى."; }

function result() {
  const n = cur.qs.length;
  st.scores[cur.r] = cur.score; st.by[cur.r] = cur.by; st.team[cur.r] = cur.team.slice(); st.pts = st.pts || []; st.pts[cur.r] = cur.pts;
  const s = screen();
  s.append(el("span", "tag", GAME.length > 1 ? "انتهت الجولة " + NR[cur.r] : "انتهت المسابقة"));
  const c = el("div", "card"); s.append(c);
  c.append(el("div", "big", AR(cur.pts) + " نقطة"));
  setTimeout(() => FX.confetti(c.querySelector(".big")), 250);
  c.append(el("p", "sub", "الإجابات الصحيحة: " + AR(cur.score) + " من " + AR(n) + ". " + verdict(cur.score / n)));
  if (teamsOn()) {
    const h = el("p", "stem", "نقاط الأفرقة في هذه الجولة"); h.style.cssText = "margin-top:16px;font-size:1rem"; c.append(h);
    c.append(board(cur.team));
    if (GAME.length > 1) { const h2 = el("p", "stem", "المجموع حتى الآن"); h2.style.cssText = "margin-top:14px;font-size:1rem"; c.append(h2); c.append(board(teamTotals())); }
  } else c.append(breakdown(cur.by, GAME[cur.r]));
  const act = el("div", "actions");
  const nx = st.scores.findIndex(x => x == null);
  act.append(btn("القائمة", "btn ghost", home));
  if (nx >= 0) act.append(btn("الجولة " + NR[nx] + " ←", "btn", () => start(nx)));
  else if (GAME.length > 1) act.append(btn("النتيجة النهائية", "btn", final));
  else act.append(btn("مسابقة جديدة", "btn", newGame));
  c.append(act);
}

function final() {
  const s = screen();
  const tot = st.scores.reduce((a, x) => a + x, 0);
  const all = GAME.reduce((a, g) => a + g.length, 0);
  s.append(el("h1", "", "النتيجة النهائية" + (role === "player" && playerName ? ": " + playerName : "")));
  if (teamsOn()) {
    const t = teamTotals(), max = Math.max(...t), win = S.teams.filter((_, i) => t[i] === max);
    const w = el("div", "card winner");
    w.append(el("div", "sub", win.length > 1 ? "تعادل" : "الفريق الفائز"));
    w.append(el("div", "big", win.join(" و ")));
    w.append(el("div", "sub", AR(max) + " نقطة"));
    w.append(board(t));
    const wc = S.teams.map((_, i) => i).filter(i => t[i] === max).map(teamColor);
    setTimeout(playClap, 300);
    setTimeout(() => FX.fireworks(wc.concat([FX.css("--gold"), FX.css("--gold2"), "#fff"])), 300);
    s.append(w);
  }
  const c = el("div", "card"); s.append(c);
  const totPts = (st.pts || []).reduce((a, x) => a + (x || 0), 0);
  c.append(el("div", "big", AR(totPts) + " نقطة"));
  c.append(el("p", "sub", "الإجابات الصحيحة: " + AR(tot) + " من " + AR(all) + ". " + verdict(tot / all)));
  const bd = el("div", "breakdown");
  GAME.forEach((g, k) => { const d = el("div"); d.append(el("span", "", "الجولة " + NR[k]), el("b", "", AR(st.scores[k]) + " / " + AR(g.length))); bd.append(d); });
  c.append(bd);
  const by = newBy(); st.by.forEach(b => Object.keys(by).forEach(t => by[t] += b[t]));
  const h = el("p", "stem", "حسب نوع السؤال"); h.style.marginTop = "16px"; h.style.fontSize = "1rem"; c.append(h);
  c.append(breakdown(by, GAME.flat()));
  const act = el("div", "actions");
  act.append(btn("القائمة", "btn ghost", home), btn("مسابقة جديدة", "btn", newGame));
  c.append(act);
}

applyLook();
deal();
role ? home() : login();
</script>
