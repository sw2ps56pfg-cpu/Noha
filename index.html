/* ---------- every screen: phone, tablet, laptop, desktop, classroom TV ---------- */
/* Type scales with the screen (and with the font-size setting), so a projector gets big text and a phone stays tidy. */
html{font-size:calc(var(--fsm,1) * clamp(15px, .45vw + 12px, 26px));-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.opt,.round,.buzz,.seg button{min-height:44px}
.wrap{width:100%}
@media (min-width:760px){
  .wrap{max-width:46rem}
  .card{padding:1.5rem 1.75rem}
  .opts:not(.tf){grid-template-columns:1fr 1fr}
  .doors{grid-template-columns:1fr 1fr}
}
@media (min-width:1100px){
  .wrap{max-width:62rem}
  .stem{font-size:1.6rem}
  .verse{font-size:1.9rem}
  .opt{padding:1rem 1.25rem;font-size:1.1rem}
  .buzzers{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
  .buzz{padding:1.25rem 1rem;font-size:1.2rem}
  .buzz .bell{font-size:2rem}
  .podium{min-height:24rem}
  .pcol{max-width:14rem}
  .pdot{width:3.4rem;height:3.4rem}.p1 .pdot{width:4.4rem;height:4.4rem}
  .p1 .pblock{height:13rem}.p2 .pblock{height:9.5rem}.p3 .pblock{height:6.8rem}
  .board{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
}
@media (min-width:1400px){html{font-size:calc(var(--fsm,1) * clamp(20px, .9vw + 6px, 32px))}.wrap{max-width:66rem}}
/* Short landscape screens (phone on its side, small laptops): keep the bell and podium inside the viewport. */
@media (max-height:520px) and (orientation:landscape){
  .wrap{padding-block:10px 20px}
  .bellwrap{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:1.5rem}
  .bellwrap > .who,.bellwrap > h1,.bellwrap > .turn{grid-column:1 / -1}
  .bellwrap > h1{font-size:1.3rem}
  .bellwrap{row-gap:8px}
  .bigbell{width:min(44vh,11rem);grid-row:span 3}
  .bigbell .ico{font-size:2.6rem}.bigbell .lbl{font-size:1.1rem}
  .podium{min-height:14rem}.p1 .pblock{height:7rem}.p2 .pblock{height:5rem}.p3 .pblock{height:3.6rem}
}
/* Hover lifts only where a pointer can hover, so taps on phones and iPads don't leave elements stuck raised. */
@media (hover:none){
  .opt:hover:not(:disabled),.round:hover,.btn:hover:not(:disabled){transform:none}
}
@media (prefers-reduced-motion:no-preference){
  .w{display:inline-block;opacity:0;animation:wordin .45s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes wordin{from{opacity:0;transform:translateY(.4em) scale(.92);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
}
.joinbox{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qr{width:9.5rem;max-width:40vw;aspect-ratio:1;background:#fff;border-radius:12px;padding:6px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.joininfo{flex:1;min-width:12rem;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.joininfo small{color:var(--muted)}
.jcode{font-family:var(--f-display);font-size:2.4rem;letter-spacing:.2em;color:var(--gold);direction:ltr;line-height:1.1}
.jlink{direction:ltr;font-size:.8rem;color:var(--muted);word-break:break-all;background:color-mix(in srgb,var(--bg) 60%,var(--surface));padding:4px 8px;border-radius:8px;max-width:100%}
.login > .btn.small{align-self:center;display:block;margin:16px auto 0}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:var(--shadow),0 0 30px -14px var(--gold)}
.resume .rtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.resume .rtx b{color:var(--gold);font-size:1.1rem}
.resume .rtx span{color:var(--muted);font-size:.95rem}
.sub.saved{color:var(--ok);font-size:.85rem}
.dot.pick{width:30px;height:30px;border:3px solid color-mix(in srgb,var(--tc) 35%,var(--surface));cursor:pointer;padding:0;flex:none;box-shadow:0 0 0 1px var(--line)}
.palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.palette .swatch{width:34px;height:34px;min-height:0;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.palette .swatch.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.swc{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer}
.swc input{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.rsel{font:inherit;font-size:.82rem;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--surface));color:var(--muted);border-radius:10px;padding:6px 8px;min-height:36px;cursor:pointer}
.rsel.set{border-color:var(--gold);color:var(--gold);font-weight:700}
.pinsum{margin-top:10px}
@media (max-width:560px){.qrow{flex-wrap:wrap}.qrow .qs{flex:1 1 calc(100% - 2.6em)}.qrow .qacts{width:100%;justify-content:flex-end;flex-wrap:wrap}}
.logo{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.logo.hero{width:min(26rem,86vw);margin:4px auto 0}
.logo.mini{width:4.6rem;flex:none}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.brand.center{justify-content:center}
.brand h1{min-width:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login > h1::before{content:none}
:root[data-theme="light"] .logo{filter:drop-shadow(0 8px 18px rgba(13,27,46,.18))}
@media (prefers-reduced-motion:no-preference){.logo.hero{animation:logoin .7s cubic-bezier(.2,.9,.3,1.2) both}@keyframes logoin{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}}
@media (max-height:520px) and (orientation:landscape){.logo.hero{width:min(15rem,40vw)}.bellwrap .logo.mini{width:3rem}}
/* logo entrance */
.logostage{position:relative;display:grid;place-items:center;margin:6px auto 0;width:min(26rem,86vw);isolation:isolate}
.logostage .logoholder{position:relative;width:100%}
.logostage .logo.hero{width:100%;margin:0}
.logostage .shine{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 48%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.75) 52%,transparent 65%) no-repeat;background-size:250% 100%;background-position:150% 0;opacity:0}
.logostage .rays{position:absolute;inset:-18%;z-index:-1;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 28%,transparent) 0deg 7deg,transparent 7deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 66%);mask-image:radial-gradient(circle,#000 18%,transparent 66%);opacity:.0}
.logostage .ring{position:absolute;width:40%;aspect-ratio:1;border-radius:50%;border:4px solid var(--gold);opacity:0;z-index:-1;pointer-events:none}
.logostage.still .rays{opacity:.35}
@media (prefers-reduced-motion:no-preference){
  .logostage:not(.still) .logo.hero{animation:logodrop 1s cubic-bezier(.25,1.4,.4,1) both, logofloat 4.5s ease-in-out 1.6s infinite}
  .logostage:not(.still) .rays{animation:raysin .9s ease-out .35s forwards, raysspin 40s linear .35s infinite}
  .logostage:not(.still) .ring{animation:ringout 1s ease-out .8s both}
  .logostage:not(.still) .shine{animation:shine 1.3s ease-in-out 1.15s both, shine 1.3s ease-in-out 6s both}
  .logostage:not(.still) + .vh + .sub{animation:fxin .5s ease-out 1s both}
  .logostage:not(.still) ~ .doors{animation:fxin .6s ease-out 1.15s both}
  @keyframes logodrop{0%{opacity:0;transform:translateY(-55%) scale(.35) rotate(-10deg);filter:drop-shadow(0 0 0 transparent) blur(6px)}55%{opacity:1;transform:translateY(4%) scale(1.08) rotate(2deg);filter:drop-shadow(0 18px 30px rgba(0,0,0,.4)) blur(0)}75%{transform:translateY(-2%) scale(.97) rotate(-1deg)}100%{opacity:1;transform:none}}
  @keyframes logofloat{50%{transform:translateY(-6px) rotate(-.6deg)}}
  @keyframes raysin{from{opacity:0;transform:scale(.4)}to{opacity:.55;transform:scale(1)}}
  @keyframes raysspin{to{rotate:360deg}}
  @keyframes ringout{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.8)}}
  @keyframes shine{0%{opacity:1;background-position:150% 0}100%{opacity:1;background-position:-60% 0}}
  .logo.mini{animation:minipop .6s cubic-bezier(.25,1.5,.4,1) both}
  @keyframes minipop{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
}
@media (max-height:520px) and (orientation:landscape){.logostage{width:min(15rem,40vw)}}
/* control + display screens */
.ctrlans{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 14px;border-radius:12px;border:1.5px dashed color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.ctrlans small{color:var(--muted);font-size:.78rem}
.ctrlans b{color:var(--ok)}
.dspstate{padding:8px 12px;border-radius:12px;border:1px dashed var(--line)}
.dspstate.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.wrap:has(.dspscreen){max-width:min(96vw,110rem)}
.dsp{display:flex;flex-direction:column;gap:1rem;position:relative}
.dsp > .tag{align-self:flex-start}
.dsp > h1{font-size:clamp(2rem,1.4rem + 1.6vw,3.4rem)}
.dspgate,.dspwait{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding-top:2vh}
.dspgate .logo.hero,.dspwait .logo.hero{width:min(34rem,80vw)}
.dspsub{font-size:1.8rem;font-weight:800;color:var(--gold);margin:0}
.dspwait .dspboard{width:100%}
.dspjoin{display:flex;gap:1.5rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.dspjoin .qr{width:12rem}
.dspjoin .jcode{font-size:3.4rem}
.dsptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dsptop .qnum{margin:0;font-size:1.6rem}
.dspq{padding:2rem 2.25rem}
.dspstem{font-size:clamp(1.8rem,1.2rem + 1.6vw,3.4rem);font-weight:800;line-height:1.55;margin:0;text-wrap:balance}
.dspverse{font-size:clamp(1.8rem,1.2rem + 1.6vw,3.2rem)}
.dspverse .filled{color:var(--ok)}
.dspopts .opt{font-size:clamp(1.2rem,.9rem + 1vw,2.2rem);padding:1rem 1.4rem;cursor:default}
.dspstatus{font-size:clamp(1.2rem,.9rem + .9vw,2rem);padding:.9rem 1rem}
.dspstatus .rd{font-size:2.6rem}
.dspchips{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:1rem}
.dchip{position:relative;display:flex;align-items:center;gap:.6rem;padding:.7rem 1.3rem .7rem 1.6rem;border-radius:999px;background:var(--tc);color:#fff;font-weight:800;font-size:clamp(1.1rem,.9rem + .6vw,1.7rem);box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 24px -6px var(--tc)}
.dchip .rank{display:grid;place-items:center;min-width:2rem;height:2rem;border-radius:50%;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1A00;font-size:1.1rem}
.dchip.active{outline:4px solid var(--gold);outline-offset:4px}
.dchip.out{opacity:.4;text-decoration:line-through}
.dspans .feedback{font-size:clamp(1.1rem,.9rem + .6vw,1.7rem)}
.dspans .dspanswer{font-weight:800}
.dsplisten{display:flex;align-items:center;justify-content:center;gap:1rem;padding:2.5rem 1rem;font-size:clamp(2rem,1.4rem + 2vw,4rem);font-weight:800;color:var(--gold)}
.dsplisten .ico{font-size:1.2em}
.dspexit{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));width:36px;height:36px;min-height:0;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);font-size:1.2rem;cursor:pointer;opacity:.35;z-index:20}
.dspexit:hover,.dspexit:focus-visible{opacity:1}
@media (prefers-reduced-motion:no-preference){.dsplisten .ico{animation:fxbeat .8s ease-in-out infinite alternate}.dchip{animation:minipop .45s cubic-bezier(.25,1.5,.4,1) both}}
/* one simple typeface everywhere */
h1,.big,.qnum,.round .rn,.pnum,.ppts,.rankrow .pl,.rankrow .pt,.team b,.door h2,.set h2,.myrank b,.status.reading .rd,.buzz .rank,.bigbell .lbl,.fxpop{font-family:var(--f-display);font-weight:800}
.verse{font-weight:700;line-height:1.9}
/* effects */
.fxcanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.fxflash{position:fixed;inset:0;pointer-events:none;z-index:49;animation:fxf .65s ease-out forwards}
.fxflash.good{background:radial-gradient(ellipse at center,color-mix(in srgb,var(--ok) 28%,transparent),transparent 70%)}
.fxflash.bad{background:radial-gradient(ellipse at center,transparent 40%,color-mix(in srgb,var(--bad) 40%,transparent))}
@keyframes fxf{from{opacity:1}to{opacity:0}}
.fxshake{animation:fxs .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes fxs{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.fxripple{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--rc);pointer-events:none;z-index:48;animation:fxr 1s ease-out both}
@keyframes fxr{from{transform:scale(1);opacity:.9}to{transform:scale(14);opacity:0}}
.fxpop{position:fixed;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:2.4rem;font-weight:700;pointer-events:none;z-index:51;text-shadow:0 4px 16px rgba(0,0,0,.45);animation:fxp 1.2s ease-out forwards}
@keyframes fxp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
@media (prefers-reduced-motion:no-preference){
  .screen .card .stem{animation:fxin .45s ease-out both}
  .screen .opts .opt{animation:fxin .4s ease-out both}
  .screen .opts .opt:nth-child(2){animation-delay:.07s}.screen .opts .opt:nth-child(3){animation-delay:.14s}.screen .opts .opt:nth-child(4){animation-delay:.21s}
  @keyframes fxin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .clock.low{animation:fxbeat .5s ease-in-out infinite alternate}
  @keyframes fxbeat{to{transform:scale(1.15)}}
  .opt.ok{animation:fxok .6s ease-out}
  @keyframes fxok{40%{transform:scale(1.04)}}
  .rankrow.first .pl{animation:fxglow 1.6s ease-in-out infinite}
  @keyframes fxglow{50%{text-shadow:0 0 14px var(--gold)}}
  .winner .big{animation:fxwin 1.2s ease-out both}
  @keyframes fxwin{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .login > h1::before{animation:fxspin 18s linear infinite}
  @keyframes fxspin{to{transform:rotate(360deg)}}
}
/* ---------- vibe layer ---------- */
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(ellipse 90% 50% at 50% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(ellipse 60% 40% at 100% 100%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 70%),var(--pat);background-attachment:fixed;background-size:auto,auto,96px 96px;min-height:100vh}
h1{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1.25;letter-spacing:0;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{line-height:1.7}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow),inset 0 1px 0 color-mix(in srgb,#fff 6%,transparent)}
.btn{font-family:var(--f-body);font-weight:800;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));color:var(--accent-ink);border-radius:14px;box-shadow:0 8px 22px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);font-weight:700}
.count{color:var(--gold);font-weight:700}
.bar{height:8px;background:color-mix(in srgb,var(--line) 70%,transparent)}
.bar i{background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px var(--gold)}
.qnum{font-family:var(--f-display);font-size:1.25rem;color:var(--gold);letter-spacing:.3px}
.stem{font-size:1.35rem;font-weight:800;line-height:1.6}
.opt{background:color-mix(in srgb,var(--bg) 55%,var(--surface));border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .15s,transform .12s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt b{font-family:var(--f-display);color:var(--gold);font-weight:600}
.opt.ok{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.verse{font-size:1.6rem;color:var(--ink)}
.verse .blank{color:var(--gold)}
.feedback.info{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.big{font-family:var(--f-display);font-size:3.6rem;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.round{background:color-mix(in srgb,var(--bg) 55%,var(--surface));border-radius:16px;padding:16px 18px;transition:border-color .15s,transform .12s}
.round:hover{border-color:var(--gold);transform:translateY(-1px)}
.round .rn{font-family:var(--f-display);font-size:1.15rem}
.round.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.seg{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.text{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.text:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.set h2{font-family:var(--f-display);font-size:1.1rem;color:var(--gold)}
.badge{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.badge.admin{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1A00;border:0}
.team{background:color-mix(in srgb,var(--bg) 50%,var(--surface));border-radius:14px}
.team b{font-family:var(--f-display);font-size:1.35rem}
.team.lead{border-color:var(--gold);box-shadow:0 0 18px -6px var(--gold)}
.buzz{border-radius:18px}
.buzz.hit{box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 26px -6px var(--tc)}
.buzz .rank{font-family:var(--f-display);background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1A00;width:34px;height:34px;font-size:1.1rem}
.status{border-radius:14px}
.winner{border-color:color-mix(in srgb,var(--gold) 50%,transparent);box-shadow:var(--shadow),0 0 50px -20px var(--gold)}
.winner .big{font-size:2.6rem}
/* login */
.login > h1{text-align:center;font-size:2.6rem;margin-top:10px}
.login > .sub{text-align:center}
.login > h1::before{content:"";display:block;width:54px;height:54px;margin:0 auto 10px;background:var(--pat) center/150% no-repeat,radial-gradient(circle,color-mix(in srgb,var(--gold) 45%,transparent),transparent 70%);border-radius:50%;-webkit-text-fill-color:initial}
.door h2{font-family:var(--f-display);font-size:1.7rem;color:var(--gold)}
/* contestant bell */
.bigbell{background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--tc) 55%,#fff) 0,var(--tc) 38%,color-mix(in srgb,var(--tc) 70%,#000) 100%);box-shadow:0 12px 0 color-mix(in srgb,var(--tc) 50%,#000),0 0 60px -10px var(--tc);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.bigbell .lbl{font-family:var(--f-display)}

// Login hero: glowing rays behind, the logo drops in with a bounce, sparkles burst, then a shine sweeps across it.
function logoHero() {
  const wrap = el("div", "logostage" + (S.fx === false ? " still" : ""));
  const rays = el("div", "rays"), ring = el("div", "ring"), shine = el("div", "shine");
  const img = logoImg("hero");
  shine.style.webkitMaskImage = shine.style.maskImage = "url(" + LOGO_SRC + ")";
  const holder = el("div", "logoholder"); holder.append(img, shine);
  wrap.append(rays, ring, holder);
  setTimeout(() => {
    if (!wrap.isConnected) return;
    const r = holder.getBoundingClientRect();
    const cols = [FX.css("--gold"), FX.css("--gold2"), "#A9D650", "#2FD3A7", "#ffffff"];
    FX.burst(r.left + r.width * .5, r.top + r.height * .45, cols, 90, 11, Math.PI * 2, 0);
    FX.burst(r.left + r.width * .15, r.top + r.height * .3, cols, 24, 6, Math.PI * 2, 0);
    FX.burst(r.left + r.width * .85, r.top + r.height * .25, cols, 24, 6, Math.PI * 2, 0);
  }, 820);
  return wrap;
}
function logoImg(cls) {
  const im = el("img", "logo " + (cls || ""));
  im.src = LOGO_SRC; im.alt = (S && S.title) || "لآلئ التجويد"; im.decoding = "async"; im.draggable = false;

}

const HEX = /^#[0-9a-f]{6}$/i;
const COLOR_PRESETS = ["#2FD3A7", "#22C55E", "#5AA9FF", "#06B6D4", "#C084FC", "#E879F9", "#FF5C8A", "#EF4444", "#FF8A4C", "#F97316", "#F2C14E", "#A3E635"];
function applyTeamColors(colors) {
  const r = document.documentElement;
  for (let i = 0; i < 6; i++) {
    const c = Array.isArray(colors) ? colors[i] : null;

}

  const hd = el("div", "top"); hd.append(el("h1", "", "الأسئلة")); s.append(hd);
  s.append(el("p", "sub", "عدّل أي سؤال أو احذفه أو أضف أسئلة جديدة، ثم اضغط «حفظ الأسئلة»."));

  const tabs = el("div", "seg qtabs"); tabs.setAttribute("role", "tablist"); s.append(tabs);
  const summaryEl = el("p", "sub pinsum"); s.append(summaryEl);
  const listCard = el("div", "card"); s.append(listCard);
  const saveBar = el("div", "actions");
  const saved = el("p", "sub"); saved.hidden = true;

  function drawTabs() {
    tabs.replaceChildren();
    ROUNDS.forEach(r => {
      const b = btn(TYPE_LABEL[r.type] + " (" + AR(B[r.type].length) + ")", "", () => { edTab = r.type; drawTabs(); drawList(); });
      b.setAttribute("role", "tab"); b.setAttribute("aria-checked", edTab === r.type); b.id = "qt-" + r.type;
      tabs.append(b);
    });
  }
  const touch = () => { dirty = true; saved.hidden = true; drawTabs(); };

  function summary(t, q) {
    if (t === "mcq") return q[0];
    if (t === "tf") return "«" + q[0] + "» (" + (q[1] ? "صح" : "خطأ") + ")";
    if (t === "ex") return "اذكر مثالًا على: " + q[0];
    return (q[0] || "…") + " ۞ " + (q[1] || "…");
  }

  function roundSel(q, i) {
    const sel = el("select", "rsel"); sel.id = "qr-" + edTab + "-" + i;
    sel.setAttribute("aria-label", "الجولة");
    const o0 = el("option", "", "تلقائي"); o0.value = ""; sel.append(o0);
    for (let k = 0; k < nR; k++) { const o = el("option", "", "الجولة " + NR[k]); o.value = k; sel.append(o); }
    const pr = P[pinKey(edTab, q)];
    sel.value = Number.isInteger(pr) && pr < nR ? String(pr) : "";
    sel.classList.toggle("set", sel.value !== "");
    sel.onchange = () => { const key = pinKey(edTab, q); if (sel.value === "") delete P[key]; else P[key] = +sel.value; sel.classList.toggle("set", sel.value !== ""); touch(); drawSummary(); };
    return sel;
  }
  function drawSummary() {
    summaryEl.replaceChildren();
    const counts = Array(nR).fill(0);
    ROUNDS.forEach(r => B[r.type].forEach(q => { const pr = P[pinKey(r.type, q)]; if (Number.isInteger(pr) && pr < nR) counts[pr]++; }));
    const total = counts.reduce((a, x) => a + x, 0);
    summaryEl.append(el("span", "", total ? "الأسئلة المحددة: " + counts.map((c, k) => "الجولة " + NR[k] + " " + AR(c)).join(" · ") : "اختر «الجولة» بجانب أي سؤال لتثبيته فيها. الأسئلة الباقية «تلقائي» تتوزع على الجولات."));
  }
  function drawList() {
    listCard.replaceChildren();
    const arr = B[edTab];
    const add = btn("+ إضافة سؤال", "btn", () => {
      const blank = { mcq: ["", ["", "", "", ""], 0, ""], tf: ["", true, ""], ex: ["", ""], v: ["", "", 1, ""] }[edTab];
      arr.push(blank); touch(); drawList(); openForm(arr.length - 1, true);
    });
    add.id = "q-add";
    const top = el("div", "top"); top.append(el("p", "stem", TYPE_LABEL[edTab]), add); listCard.append(top);
    if (!arr.length) listCard.append(el("p", "sub", "لا توجد أسئلة في هذا النوع. أضف سؤالًا، أو أوقف هذا النوع من الإعدادات."));
    const ul = el("div", "qlist"); listCard.append(ul);
    arr.forEach((q, i) => {
      const row = el("div", "qrow"); row.id = "qrow-" + i;
      row.append(el("span", "qn", AR(i + 1)), el("span", "qs", summary(edTab, q) || "(سؤال فارغ)"));
      const acts = el("span", "qacts");
      acts.append(roundSel(q, i));
      acts.append(btn("تعديل", "btn ghost small", () => openForm(i)));
      const del = btn("حذف", "btn ghost small danger", () => {
        if (del.dataset.armed) { delete P[pinKey(edTab, q)]; arr.splice(i, 1); touch(); drawList(); drawSummary(); return; }
        del.dataset.armed = "1"; del.textContent = "تأكيد الحذف";
        setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "حذف"; } }, 3000);
      });
      acts.append(del); row.append(acts); ul.append(row);

  function field(label, value, id, multi) {
    const w = el("div", "row col");
    const l = el("label", "", label); l.htmlFor = id;
    const i = el(multi ? "textarea" : "input", "text"); i.id = id; i.value = value == null ? "" : value;
    if (multi) i.rows = 2;
    w.append(l, i); return [w, i];
  }

  function openForm(i, isNew) {
    const arr = B[edTab], q = arr[i], t = edTab;
    const row = document.getElementById("qrow-" + i);
    const f = el("form", "qform"); f.id = "qform";
    const old = document.getElementById("qform"); if (old) old.remove();
    const getters = [];
    if (t === "mcq") {
      const [w1, stem] = field("السؤال", q[0], "f-stem", true); f.append(w1);
      const ow = el("div", "row col"); ow.append(el("label", "", "الخيارات (اختر الإجابة الصحيحة)"));
      const optInputs = [];
      for (let k = 0; k < 4; k++) {
        const r = el("label", "optedit");
        const rb = el("input"); rb.type = "radio"; rb.name = "f-correct"; rb.id = "f-c" + k; rb.checked = q[2] === k;
        const oi = el("input", "text"); oi.id = "f-o" + k; oi.value = q[1][k] || ""; oi.placeholder = "الخيار " + LET[k];
        r.append(rb, el("b", "", LET[k] + ")"), oi); ow.append(r); optInputs.push([rb, oi]);
      }
      f.append(ow);
      const [w3, why] = field("التعليل (اختياري)", q[3], "f-why"); f.append(w3);
      getters.push(() => {
        const opts = optInputs.map(([, oi]) => oi.value.trim());
        const c = optInputs.findIndex(([rb]) => rb.checked);
        if (!stem.value.trim()) return "اكتب نص السؤال.";
        if (opts.filter(Boolean).length < 2) return "اكتب خيارين على الأقل.";
        if (c < 0 || !opts[c]) return "حدّد الإجابة الصحيحة من الخيارات المكتوبة.";
        const kept = opts.map((o, k) => [o, k]).filter(([o]) => o);
        return [stem.value.trim(), kept.map(([o]) => o), kept.findIndex(([, k]) => k === c), why.value.trim()];
      });
    } else if (t === "tf") {
      const [w1, stem] = field("العبارة", q[0], "f-stem", true); f.append(w1);
      let val = q[1];
      const r = el("div", "row"); r.append(el("label", "", "الحكم الصحيح"), seg("f-tf", [[true, "صح"], [false, "خطأ"]], val, v => val = v)); f.append(r);
      const [w3, why] = field("التصحيح أو التعليل (اختياري)", q[2], "f-why"); f.append(w3);
      getters.push(() => stem.value.trim() ? [stem.value.trim(), val, why.value.trim()] : "اكتب العبارة.");
    } else if (t === "ex") {
      const [w1, stem] = field("اذكر مثالًا على:", q[0], "f-stem"); f.append(w1);
      const [w2, ans] = field("أمثلة من المنهج (الإجابة)", q[1], "f-ans", true); f.append(w2);
      getters.push(() => !stem.value.trim() ? "اكتب المطلوب." : !ans.value.trim() ? "اكتب مثالًا للإجابة." : [stem.value.trim(), ans.value.trim()]);
    } else {
      const [w1, a] = field("الشطر الأول", q[0], "f-a"); f.append(w1);
      const [w2, b] = field("الشطر الثاني", q[1], "f-b"); f.append(w2);
      let blank = q[2];
      const r = el("div", "row"); r.append(el("label", "", "الشطر المخفي"), seg("f-blank", [[0, "الأول"], [1, "الثاني"]], blank, v => blank = v)); f.append(r);
      const [w4, src] = field("المصدر (مثل: تحفة الأطفال)", q[3], "f-src"); f.append(w4);
      getters.push(() => !a.value.trim() || !b.value.trim() ? "اكتب الشطرين." : [a.value.trim(), b.value.trim(), blank, src.value.trim()]);
    }
    const err = el("p", "sub warn"); err.hidden = true; f.append(err);
    const fa = el("div", "pair");
    const ok = el("button", "btn", "تم"); ok.type = "submit";
    fa.append(btn("إلغاء", "btn ghost", () => { if (isNew) { arr.splice(i, 1); touch(); } drawList(); }), ok);
    f.append(fa);
    f.onsubmit = (e) => {
      e.preventDefault();
      const v = getters[0]();
      if (typeof v === "string") { err.textContent = v; err.hidden = false; return; }
      const oldK = pinKey(t, q), newK = pinKey(t, v);
      if (oldK !== newK && P[oldK] != null) { P[newK] = P[oldK]; delete P[oldK]; }
      arr[i] = v; touch(); drawList(); drawSummary();
      const r2 = document.getElementById("qrow-" + i); if (r2) { r2.classList.add("flash"); r2.scrollIntoView({ block: "nearest" }); }
    };
    if (row) row.after(f); else listCard.append(f);
    f.scrollIntoView({ block: "nearest" });
    const first = f.querySelector("input.text, textarea"); if (first) first.focus();
  }

  const reset = btn("استعادة الأسئلة الأصلية", "btn ghost small danger", () => {
    if (!reset.dataset.armed) { reset.dataset.armed = "1"; reset.textContent = "اضغط مرة أخرى للتأكيد"; setTimeout(() => { if (reset.isConnected) { delete reset.dataset.armed; reset.textContent = "استعادة الأسئلة الأصلية"; } }, 3000); return; }
    const o = JSON.parse(ORIGINAL); ["mcq", "tf", "ex", "v"].forEach(k => B[k] = o[k]); touch(); drawList();
  });
  const back = btn("رجوع", "btn ghost", () => {
    if (dirty && !back.dataset.armed) { back.dataset.armed = "1"; back.textContent = "خروج بدون حفظ؟"; setTimeout(() => { if (back.isConnected) { delete back.dataset.armed; back.textContent = "رجوع"; } }, 3000); return; }
    settings();
  });

    const open = document.getElementById("qform"); if (open) open.remove();
    persistBank(B); S.pins = P; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} dirty = false; inRound = false; cur = null; deal(); saveProgress();
    saved.textContent = "حُفظت الأسئلة، وبدأت مسابقة جديدة بها."; saved.hidden = false; drawTabs(); drawList();
  });
  const right = el("div", "pair"); right.append(reset, saveQ); saveQ.id = "save-q";
  saveBar.append(back, right);
  s.append(saved, saveBar);
  drawTabs(); drawList(); drawSummary();
}

function seg(id, opts, val, on) {
  const w = el("div", "seg"); w.id = id; w.setAttribute("role", "radiogroup");
  opts.forEach(([v, t]) => { const b = btn(t, "", () => { w.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", x === b)); on(v); }); b.setAttribute("role", "radio"); b.setAttribute("aria-checked", v === val); w.append(b); });
  return w;
}

  controlHint(T, q, c);
  const pushT = () => hostEmit({ view: { k: "q", mode: "turn", qid: "t" + cur.r + "-" + cur.i + "-" + qSeq, qn: cur.i + 1, n, round: GAME.length > 1 ? NR[cur.r] : "", typeName: R.name, ...qPayload(T, q, tDone),
    qHidden: !!(qHidT && !qHidT.shown()), optsHidden: !!(mcqBox && mcqBox.hidden), done: tDone, winner: tWin, gotPts: 0, turn: TI >= 0 ? TI : null, bad: [], order: [], excluded: [] } });
  qSeq++; pushT();
  if (S.timer) {
    let left = S.timer;
    const tick = () => { clock.textContent = "⏱ " + AR(left); clock.classList.toggle("low", left <= 5); };
    tick();
    timerId = setInterval(() => { left--; tick(); if (left <= 0) { clearInterval(timerId); if (!cur.answered) onTimeout(); } }, 1000);
  }

  const act = el("div", "actions");
  act.append(btn("القائمة", "btn ghost", home), next);
  s.append(act);
}

function playClap(force) {
  if ((!S.clap || isControl()) && !force) return;
  try {
    if (!clapAudio) clapAudio = new Audio(CLAP_SRC);
    clapAudio.pause(); clapAudio.currentTime = 0;
    const p = clapAudio.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

function buzzQuestion() {
  const it = cur.qs[cur.i], q = it.q, T = it.t, R = ROUNDS.find(x => x.type === T), n = cur.qs.length; RV = 0;
  cur.answered = false; saveProgress();
  const s = screen();
  const top = el("div", "top");
  top.append(el("span", "tag", (GAME.length > 1 ? "الجولة " + NR[cur.r] + " · " : "") + R.name), el("span", "count", "أسرع إجابة"));
  s.append(top);
  const liveScores = () => { const t = teamTotals(cur.r); cur.team.forEach((v, i) => t[i] += v); return t; };
  let boardEl = board(liveScores(), null); s.append(boardEl);
  const bar = el("div", "bar"); const fill = el("i"); fill.style.width = (cur.i / n * 100) + "%"; bar.append(fill); s.append(bar);

  const c = el("div", "card"); s.append(c);
  const qh = el("div", "qhead");
  qh.append(el("div", "qnum", "السؤال " + AR(cur.i + 1) + " من " + AR(n)));
  const clock = el("span", "clock"); if (S.timer) qh.append(clock);
  c.append(qh);

  // question body
  let box = null, opts = null, correct = -1, why = "", ansNode = null, bHid = null;
  if (T === "mcq" || T === "tf") {
    const [stem, a2, a3, a4] = q;
    opts = T === "mcq" ? a2 : ["صح", "خطأ"];
    correct = T === "mcq" ? a3 : (a2 ? 0 : 1);
    why = T === "mcq" ? a4 : a3;
    c.append(W("p", "stem", T === "tf" ? "«" + stem + "»" : stem));
    box = el("div", "opts" + (T === "tf" ? " tf" : "")); c.append(box);
    opts.forEach((o, k) => {
      const b = btn("", "opt", () => choose(k)); b.id = "o" + k; b.disabled = true;
      if (T === "mcq") b.append(el("b", "", LET[k] + ")"));
      b.append(o); box.append(b);
    });
    if (T === "mcq" && !S.showOpts) bHid = hideOptions(box, c, () => {
      if (answering != null && !done) [...box.children].forEach(b => { if (!b.classList.contains("bad")) b.disabled = false; });
      if (typeof emitQ === "function") emitQ();
    });
  } else if (T === "ex") {
    c.append(W("p", "stem", "اذكر مثالًا على: " + q[0]));
    ansNode = el("div", "feedback info", "من أمثلة المنهج: " + q[1]);
  } else {
    const [a, b, blank, src] = q;
    c.append(el("p", "stem", "أكمل البيت"));
    c.append(el("div", "sub", src));
    const vs = el("div", "verse");
    vs.append(blank === 0 ? el("span", "blank", "……………………") : W("span", "", a));
    vs.append(blank === 1 ? el("span", "blank", "……………………") : W("span", "", b));
    c.append(vs);
    ansNode = el("div", "feedback info");
    ansNode.append(el("span", "v", a), el("span", "v", b));
  }

  let badOpts = [], gotPts = 0, winnerV = null, finMsg = "";
  const qHid = hideQuestion(T, c, () => emitQ());
  controlHint(T, q, c);
  // buzzers
  const status = el("div", "status", "اضغطوا الجرس: الأسرع يجيب أولًا");
  const bz = el("div", "buzzers");
  const judge = el("div", "self"); judge.hidden = true;
  const skip = btn("لا أحد يعرف: إظهار الإجابة", "btn ghost small", () => finish(-1, "لم يُجب أحد."));
  skip.classList.add("skip");
  const excluded = new Set();
  let answering = null, done = false;
  const order = []; // teams in the order they pressed the bell
  let reading = Math.max(0, S.readTime | 0); // seconds left before the bell opens
  let revealing = false; // true while the question's words are still appearing

  S.teams.forEach((name, i) => {
    const b = btn("", "buzz t" + (i % 6), () => buzz(i)); b.id = "bz" + i;
    b.append(el("span", "rank"), el("span", "bell", "🔔"), el("span", "bn", name), el("kbd", "", AR(i + 1)));
    bz.append(b);
  });
  c.append(status, bz);
  c.append(judge);
  c.append(skip);

  const next = btn(cur.i + 1 < n ? "السؤال التالي ←" : "عرض النتيجة", "btn", () => advance());
  next.disabled = true;

  const qid = "q" + (++qSeq) + "-" + Date.now().toString(36);
  const qv = () => ({ k: "q", mode: "buzz", qid, qn: cur.i + 1, n, round: GAME.length > 1 ? NR[cur.r] : "", typeName: R.name, ...qPayload(T, q, done),
    qHidden: !!(qHid && !qHid.shown()), optsHidden: !!(box && box.hidden), bad: badOpts.slice(), done, winner: winnerV, gotPts, msg: finMsg,
    reading: done ? 0 : reading, revealing: !done && revealing, answering, order: order.slice(), excluded: [...excluded] });
  const emitQ = (extra) => hostEmit({ view: qv(), qid, qn: cur.i + 1, open: !done && !reading && !revealing, reading: revealing ? Math.max(reading, 1) : reading, answering, excluded: [...excluded], order: order.slice(), done, ...extra });
  const refresh = () => {
    [...bz.children].forEach((b, i) => {
      const r = order.indexOf(i);
      b.disabled = done || r >= 0 || reading > 0 || revealing;
      b.classList.toggle("wait", (reading > 0 || revealing) && !done);
      b.classList.toggle("hit", r >= 0);
      b.classList.toggle("active", answering === i);
      b.classList.toggle("out", excluded.has(i));
      b.querySelector(".rank").textContent = r >= 0 ? AR(r + 1) : "";
    });
  };

  // timer: runs while the floor is open, pauses while a team answers
  let left = S.timer;
  const tick = () => { clock.textContent = "⏱ " + AR(left); clock.classList.toggle("low", left <= 5); };
  const runClock = () => {
    if (!S.timer || done) return;
    clearInterval(timerId); clock.classList.remove("off");
    timerId = setInterval(() => { left--; tick(); if (left <= 0) { clearInterval(timerId); finish(-1, "انتهى الوقت."); } }, 1000);
  };
  const pauseClock = () => { clearInterval(timerId); clock.classList.add("off"); };
  if (S.timer) tick();

  function buzz(i) {
    if (done || reading > 0 || revealing || excluded.has(i) || order.includes(i) || i < 0 || i >= S.teams.length) return;
    order.push(i);
    const bzBtn = document.getElementById("bz" + i); FX.ripple(bzBtn, teamColor(i));
    ringBell();
    if (answering == null) setAnswer(i); else { refresh(); emitQ(); }
  }

  function setAnswer(i) {
    answering = i; pauseClock(); refresh(); emitQ();
    status.replaceChildren("يجيب الآن: ", el("b", "t" + (i % 6), S.teams[i]));
    status.className = "status on t" + (i % 6);
    if (box && !box.hidden) {
      [...box.children].forEach(b => { if (!b.classList.contains("bad")) b.disabled = false; });
    } else {
      judge.replaceChildren();
      const y = btn("أصاب ✓", "opt", () => choose(true)); y.id = "yes";
      const nn = btn("أخطأ ✗", "opt", () => choose(false)); nn.id = "no";
      judge.append(y, nn); judge.hidden = false;
    }
  }

  function choose(k) {
    if (done || answering == null) return;
    const i = answering;
    const right = typeof k === "boolean" ? k : k === correct;
    if (right) {
      const p = qPoints(T, box); cur.score++; cur.pts += p; cur.by[T]++; cur.team[i] += p; gotPts = p;
      finish(i, "إجابة صحيحة من «" + S.teams[i] + "» (+" + AR(p) + ")");
      const tb = document.getElementById("bz" + i);
      FX.confetti(tb, teamColor(i)); FX.flash("good"); playClap(); FX.pop(tb, "+" + AR(p), teamColor(i));
      return;
    }
    if (box && typeof k === "number") { box.children[k].classList.add("bad"); badOpts.push(k); }
    FX.shake(c); FX.flash("bad");
    if (box) [...box.children].forEach(b => b.disabled = true);
    judge.hidden = true;
    excluded.add(i); answering = null;
    const remaining = S.teams.length - excluded.size;
    if (!remaining) { finish(-1, "أخطأت كل الأفرقة."); return; }
    const nx = order.find(t => !excluded.has(t));
    if (nx != null) { setAnswer(nx); status.prepend(el("span", "late", "أخطأ «" + S.teams[i] + "». ")); return; }
    status.className = "status miss";
    status.textContent = "إجابة خاطئة من «" + S.teams[i] + "». الجرس مفتوح لبقية الأفرقة.";
    refresh(); runClock(); emitQ();
  }

  function finish(winner, msg) {
    if (done) return;
    if (qHid) qHid.reveal();
    done = true; answering = null; reading = 0; revealing = false; clearInterval(readTimerId); clearTimeout(revealTimerId); if (openNow) openNow.remove(); pauseClock(); refresh();
    judge.hidden = true; skip.remove();
    document.removeEventListener("keydown", keyHandler);
    const ok = winner >= 0;
    status.className = "status " + (ok ? "win t" + (winner % 6) : "miss");
    status.textContent = ok ? "النقطة لـ«" + S.teams[winner] + "»" : msg;
    if (box) {
      if (bHid) bHid.reveal();
      [...box.children].forEach(b => b.disabled = true);
      box.children[correct].classList.add("ok");
      const f = el("div", "feedback " + (ok ? "ok" : "bad"), (ok ? msg : msg + " الصواب: " + opts[correct]) + (why && S.showWhy ? ". " + why : ""));
      box.after(f);
    } else {
      if (!ok) ansNode.prepend(el("strong", "late", msg + " "));
      status.after(ansNode);
    }
    const nb = board(liveScores(), null); boardEl.replaceWith(nb); boardEl = nb;
    cur.answered = true; next.disabled = false; next.focus();
    winnerV = ok ? winner : null; finMsg = ok ? "" : msg;
    remoteBuzz = null; emitQ({ winner: winnerV });
    saveProgress();
  }

  keyHandler = (e) => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const d = "١٢٣٤٥٦".indexOf(e.key) >= 0 ? "١٢٣٤٥٦".indexOf(e.key) : "123456".indexOf(e.key);
    if (d >= 0 && d < S.teams.length) { e.preventDefault(); buzz(d); }
  };
  document.addEventListener("keydown", keyHandler);
  let openNow = null;
  const openBell = () => {
    clearInterval(readTimerId); reading = 0;
    if (openNow) { openNow.remove(); openNow = null; }
    if (done) return;
    status.className = "status go"; status.textContent = "الجرس مفتوح! اضغطوا الآن";
    FX.flash("go"); refresh(); emitQ(); runClock();
  };
  staggerOpts(box);
  const begin = () => {
  revealing = false;
  if (done) return;
  if (reading > 0) {
    const showRead = () => {
      status.className = "status reading";
      status.replaceChildren(el("span", "", (qHid && document.getElementById("reveal-q") ? "استمعوا للسؤال…" : "اقرؤوا السؤال…") + " يُفتح الجرس بعد"), el("b", "rd", AR(reading)));
    };
    showRead();
    openNow = btn("فتح الجرس الآن", "btn ghost small", openBell); openNow.id = "open-now"; openNow.classList.add("skip");
    status.after(openNow);
    readTimerId = setInterval(() => { reading--; if (reading <= 0) openBell(); else { showRead(); emitQ(); } }, 1000);
    refresh(); emitQ();
  } else { openBell(); }
  };
  if (RV > 0) {
    revealing = true;
    status.className = "status reading"; status.textContent = "يُعرض السؤال…";
    refresh();
    revealTimerId = setTimeout(begin, RV + 300);
  } else if (reading > 0) begin();
  else { refresh(); runClock(); }
  curQid = qid; remoteBuzz = buzz; emitQ();

  const act = el("div", "actions");
  act.append(btn("القائمة", "btn ghost", home), next);
  s.append(act);
}

// Points for a correct answer: multiple-choice answered with its options showing earns the reduced score.
function qPoints(T, box) { return T === "mcq" && box && !box.hidden ? S.optPts : S.pts; }

function advance(skipRank) {
  const n = cur.qs.length;
  if (cur.i + 1 >= n) return result();
  if (!skipRank && teamsOn() && S.showRank) return rankScreen();
  cur.i++; question();
}

function rankScreen() {
  const s = screen();
  const totals = teamTotals(cur.r); cur.team.forEach((v, i) => totals[i] += v);
  hostEmit({ idle: true, totals, view: { k: "rank", totals, after: cur.i + 1, n: cur.qs.length, round: GAME.length > 1 ? NR[cur.r] : "" } });
  setTimeout(() => { const f = document.querySelector(".pcol.p1"); if (f && totals[order[0]] > 0) { const r = f.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + 20, [FX.css("--gold"), FX.css("--gold2"), teamColor(order[0]), "#fff"], 70, 9); } }, 1150);
  s.append(el("span", "tag", (GAME.length > 1 ? "الجولة " + NR[cur.r] + " · " : "") + "بعد السؤال " + AR(cur.i + 1) + " من " + AR(cur.qs.length)));
  s.append(el("h1", "", "ترتيب الأفرقة"));
  const c = el("div", "card"); s.append(c);
  const order = S.teams.map((n, i) => i).sort((a, b) => totals[b] - totals[a]);
  const places = []; order.forEach((i, k) => { places[k] = k && totals[i] === totals[order[k - 1]] ? places[k - 1] : k + 1; });
  // podium: top three, shown 2nd · 1st · 3rd
  const pod = el("div", "podium"); c.append(pod);
  const slots = [[1, "p2"], [0, "p1"], [2, "p3"]];
  slots.forEach(([k, cls], idx) => {
    if (order[k] == null) return;
    const i = order[k], pl = places[k];
    const col = el("div", "pcol " + cls + " t" + (i % 6));
    col.style.setProperty("--d", ({ p3: 0, p2: 1, p1: 2 })[cls] * 260 + "ms");
    const who = el("div", "pwho");
    if (pl === 1 && totals[i] > 0) who.append(el("span", "crown", "♛"));
    who.append(el("span", "pdot"), el("span", "pname", S.teams[i]), el("b", "ppts", AR(totals[i]) + " نقطة"));
    const block = el("div", "pblock"); block.append(el("span", "pnum", AR(pl)));
    col.append(who, block); pod.append(col);
  });
  // everyone below third place
  if (order.length > 3) {
    const list = el("div", "ranklist"); c.append(list);
    order.slice(3).forEach((i, k) => {
      const r = el("div", "rankrow t" + (i % 6));
      r.style.setProperty("--w", "0%"); r.style.setProperty("--d", (900 + k * 80) + "ms");
      r.append(el("span", "pl", AR(places[k + 3])), el("span", "nm", S.teams[i]), el("b", "pt", AR(totals[i])));
      list.append(r);
    });
  }
  const act = el("div", "actions");
  const off = btn("إيقاف عرض الترتيب", "btn ghost small", () => { S.showRank = false; save(); advance(true); });
  const go = btn("السؤال التالي ←", "btn", () => advance(true));
  go.id = "rank-next";
  act.append(off, go); s.append(act);
  go.focus();
}

function breakdown(by, list) {
  const bd = el("div", "breakdown");
  ROUNDS.forEach(r => { const tot = list.filter(x => x.t === r.type).length; if (!tot) return; const d = el("div"); d.append(el("span", "", r.name), el("b", "", AR(by[r.type]) + " / " + AR(tot))); bd.append(d); });
  return bd;
}
function verdict(p) { return p >= .9 ? "ممتاز، بارك الله فيك." : p >= .7 ? "أحسنت، مستوى جيد جدًا." : p >= .5 ? "جيد، راجع الأحكام التي أخطأت فيها." : "تحتاج إلى مراجعة هذه الأبواب مرة أخرى."; }

function result() {
  const n = cur.qs.length;
  st.scores[cur.r] = cur.score; st.by[cur.r] = cur.by; st.team[cur.r] = cur.team.slice(); st.pts = st.pts || []; st.pts[cur.r] = cur.pts;
  inRound = false; saveProgress();
  const s = screen();
  hostEmit({ idle: true, view: { k: "result", round: NR[cur.r], totals: teamTotals() } });
  s.append(el("span", "tag", GAME.length > 1 ? "انتهت الجولة " + NR[cur.r] : "انتهت المسابقة"));
  const c = el("div", "card"); s.append(c);
  c.append(el("div", "big", AR(cur.pts) + " نقطة"));
  setTimeout(() => FX.confetti(c.querySelector(".big")), 250);
  c.append(el("p", "sub", "الإجابات الصحيحة: " + AR(cur.score) + " من " + AR(n) + ". " + verdict(cur.score / n)));
  if (teamsOn()) {
    const h = el("p", "stem", "نقاط الأفرقة في هذه الجولة"); h.style.cssText = "margin-top:16px;font-size:1rem"; c.append(h);
    c.append(board(cur.team));
    if (GAME.length > 1) { const h2 = el("p", "stem", "المجموع حتى الآن"); h2.style.cssText = "margin-top:14px;font-size:1rem"; c.append(h2); c.append(board(teamTotals())); }
  } else c.append(breakdown(cur.by, GAME[cur.r]));
  const act = el("div", "actions");
  const nx = st.scores.findIndex(x => x == null);
  act.append(btn("القائمة", "btn ghost", home));
  if (nx >= 0) act.append(btn("الجولة " + NR[nx] + " ←", "btn", () => start(nx)));
  else if (GAME.length > 1) act.append(btn("النتيجة النهائية", "btn", final));
  else act.append(btn("مسابقة جديدة", "btn", newGame));
  c.append(act);
}

function final() {
  const s = screen();
  if (role === "admin") hostEmit({ idle: true, view: { k: "final", totals: teamTotals() } });
  const tot = st.scores.reduce((a, x) => a + x, 0);
  const all = GAME.reduce((a, g) => a + g.length, 0);
  s.append(el("h1", "", "النتيجة النهائية" + (role === "player" && playerName ? ": " + playerName : "")));
  if (teamsOn()) {
    const t = teamTotals(), max = Math.max(...t), win = S.teams.filter((_, i) => t[i] === max);
    const w = el("div", "card winner");
    w.append(el("div", "sub", win.length > 1 ? "تعادل" : "الفريق الفائز"));
    w.append(el("div", "big", win.join(" و ")));
    w.append(el("div", "sub", AR(max) + " نقطة"));
    w.append(board(t));
    const wc = S.teams.map((_, i) => i).filter(i => t[i] === max).map(teamColor);
    setTimeout(playClap, 300);
    setTimeout(() => FX.fireworks(wc.concat([FX.css("--gold"), FX.css("--gold2"), "#fff"])), 300);
    s.append(w);
  }
  const c = el("div", "card"); s.append(c);
  const totPts = (st.pts || []).reduce((a, x) => a + (x || 0), 0);
  c.append(el("div", "big", AR(totPts) + " نقطة"));
  c.append(el("p", "sub", "الإجابات الصحيحة: " + AR(tot) + " من " + AR(all) + ". " + verdict(tot / all)));
  const bd = el("div", "breakdown");
  GAME.forEach((g, k) => { if (!g.length) return; const d = el("div"); d.append(el("span", "", "الجولة " + NR[k]), el("b", "", AR(st.scores[k]) + " / " + AR(g.length))); bd.append(d); });
  c.append(bd);
  const by = newBy(); st.by.forEach(b => Object.keys(by).forEach(t => by[t] += b[t]));
  const h = el("p", "stem", "حسب نوع السؤال"); h.style.marginTop = "16px"; h.style.fontSize = "1rem"; c.append(h);
  c.append(breakdown(by, GAME.flat()));
  const act = el("div", "actions");
  act.append(btn("القائمة", "btn ghost", home), btn("مسابقة جديدة", "btn", newGame));
  c.append(act);
}

applyLook();
dealOrRestore();
role ? home() : login();
</script>

</body>
